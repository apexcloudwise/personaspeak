name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  personas-and-cli:
    name: Validate personas & smoke-test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r desktop/requirements.txt
      - name: Validate persona schema
        run: python desktop/validate_personas.py
      - name: CLI smoke test
        run: python desktop/personaspeak.py --list
      - name: Persona validation unit tests
        run: python -m unittest desktop/test_validate_personas.py

  patchnote-gate:
    name: PATCHNOTES.md touched
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Escape hatch: a PR carrying the `no-patchnote` label skips the check.
      # The skip is announced loudly — house rule is "loud skips, never silent ones."
      - name: Announce escape-hatch skip
        if: contains(github.event.pull_request.labels.*.name, 'no-patchnote')
        run: |
          echo "::notice::Patch-note gate intentionally skipped — this PR carries the 'no-patchnote' label. A loud skip, not a silent one."
      - name: Checkout (full history so we can diff against the base)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-patchnote') }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require PATCHNOTES.md in the diff
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-patchnote') }}
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          # Capture the diff so a Git failure remains fatal, then match without
          # a pipeline: an early-exiting reader can trigger SIGPIPE under
          # `pipefail` on a large path list even when PATCHNOTES.md is present.
          changed="$(git diff --name-only "${base}...HEAD")"
          if [[ $'\n'"$changed"$'\n' == *$'\nPATCHNOTES.md\n'* ]]; then
            echo "::notice::PATCHNOTES.md is in the diff — gate satisfied."
          else
            echo "::error::This PR doesn't touch PATCHNOTES.md. Every merged PR adds a one-line entry at the top of PATCHNOTES.md, in the VOICE.md register — true thing first, joke second. If this PR genuinely ships without one (pure revert, meta-fix on the gate itself, etc.), apply the 'no-patchnote' label and push again. The skip is loud, never silent."
            exit 1
          fi

  m2-device-suite:
    name: M2 device qualification suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run m2_device focused suite
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest discover -s android/scripts/tests/m2_device -v

  android-build:
    name: Milestone 2 gate
    # Draft integration PRs receive the cheap checks above; run the costly
    # Android qualification when the PR is ready, and always on main pushes.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install scan tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          command -v rg
          rg --version
      # ASK's android_unit_test.gradle pins robolectric.dependency.dir to
      # keyboard/.robolectric-android-all-jars ONLY when it detects CI, so that
      # hosted runs resolve a fixed set of android-all jars instead of
      # whatever Maven serves that day. Upstream fills that directory from its
      # own CI script; ours has to do the same or every Robolectric test fails
      # with "Path is not a file". Local runs never hit this, because isCi is
      # false there and Robolectric resolves normally — which is precisely why
      # it has to be a CI step and not something we notice on a laptop.
      - name: Restore the ASK Robolectric jar cache
        id: robolectric-cache
        uses: actions/cache@v5
        with:
          path: android/keyboard/.robolectric-android-all-jars
          key: robolectric-jars-${{ hashFiles('android/keyboard/scripts/robolectric_jars_versions.txt') }}
      - name: Populate the ASK Robolectric jar cache
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        working-directory: android/keyboard
        run: |
          set -euo pipefail
          bash scripts/download_robolectric_jars_to_machine.sh
      - name: Require the Robolectric jars to be present
        working-directory: android/keyboard
        run: |
          set -euo pipefail
          count="$(find .robolectric-android-all-jars -name '*.jar' | wc -l | tr -d ' ')"
          echo "cached android-all jars: $count"
          # A restored-but-empty cache would otherwise hand the gate the exact
          # failure this step exists to prevent, only quieter.
          test "$count" -ge 11
      # The verifier fixture suites run first and separately, so a broken
      # verifier is a distinct red step rather than something the aggregate
      # gate quietly inherits. The gate runs them again; that is intentional
      # — this step exists so the failure is legible in the job list.
      - name: Verifier fixture suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in verify-ask-closure-test verify-dictionary-licenses-test \
                       verify-upstream-ledger-test verify-single-apk-test \
                       verify-unified-build-flag-test verify-no-secret-logging-test \
                       verify-floris-host-test verify-floris-release-test \
                       verify-milestone-2-test verify-milestone-4-test \
                       verify-milestone-7-test verify-milestone-8-test; do
            echo "::group::$suite"
            bash "android/scripts/tests/$suite.sh"
            echo "::endgroup::"
          done

      # Every milestone scan, test, lint, build, artifact and manifest
      # assertion lives inside the gates, matching local acceptance.
      - name: Milestone 2 aggregate gate
        shell: bash
        run: bash android/scripts/verify-milestone-2.sh android
      - name: Milestone 4 verification gate
        shell: bash
        run: bash android/scripts/verify-milestone-4.sh android
      - name: Milestone 7 verification gate
        shell: bash
        run: bash android/scripts/verify-milestone-7.sh android
      - name: Milestone 8 verification gate
        shell: bash
        run: bash android/scripts/verify-milestone-8.sh android
      # ADR-0003's real-InputConnection composing tests run on a device
      # (evidence job, no emulator here), but they must never stop
      # compiling — this step builds the instrumentation APK so drift
      # is a red CI step, not a surprise during the next journey.
      - name: Build the real-InputConnection instrumentation APK
        working-directory: android
        run: ./gradlew :personaspeak-ime:assembleDebugAndroidTest --console=plain
      - name: Canonical APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk=android/keyboard/ime/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          sha256sum "$apk"
      # Only the canonical APK. Uploading a second one would recreate, in the
      # artifact tab, exactly the ambiguity the cutover removed from the tree.
      - name: Upload canonical APK
        uses: actions/upload-artifact@v6
        with:
          name: personaspeak-debug-apk
          path: android/keyboard/ime/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload non-APK reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: milestone-2-reports
          path: |
            android/**/build/reports/**
            android/**/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  floris-host-build:
    name: FlorisBoard second-host build
    # Same draft-skip as android-build: the second Gradle root is costly to
    # build (native Rust for four ABIs), so drafts get the cheap gates only.
    # This job is ADR-0010's readiness-bar item 5 — without it, a broken
    # floris root would surface only on a contributor's laptop.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The floris root's lib/native builds its Rust crate through CMake,
      # which looks for rustup/cargo in ~/.cargo/bin (lib/native/src/main/
      # rust/CMakeLists.txt). Toolchain pinned to the same version as the
      # vendored gradle/tools.versions.toml (rustToolchain = "1.83.0") —
      # bump them together or the ledger owes an explanation.
      - name: Install Rust 1.83.0
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.83.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The vendored root pins cmake 4.0.2 (tools.versions.toml); hosted
      # runners ship an older one and AGP does not auto-install it
      # (CXX1300 on the first run). Installing the pinned version through
      # sdkmanager keeps the vendored pin untouched — upstream rent stays
      # upstream's shape, the runner meets it where it is.
      - name: Install pinned CMake 4.0.2
        run: |
          set -euo pipefail
          # No `yes |` pipe: under pipefail the licence-feeder dying of
          # SIGPIPE when sdkmanager exits would fail the step. Runner
          # images ship accepted licences; the list_installed check below
          # is the gate that says the install actually happened.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;4.0.2" < /dev/null > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -q "cmake;4.0.2" || {
            echo "::error::cmake;4.0.2 not installed after sdkmanager run"; exit 1; }
      - name: Build the second-host APK
        working-directory: android/florisboard
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug -PpersonaspeakFlorisAppId=biz.pixelperfectstudios.personaspeak.floris
      # Identity is asserted, the APK is NOT uploaded: a second artifact in
      # the artifact tab would recreate exactly the two-APK ambiguity the
      # canonical-upload policy exists to prevent. One release path, one
      # artifact; this build is proof, not product.
      - name: Second-host APK identity
        working-directory: android/florisboard
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          sha256sum "$apk"
